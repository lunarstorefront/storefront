name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, exif, gd, intl, pdo_sqlite, sqlite3
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pest
        run: vendor/bin/pest
        env:
          PAO_DISABLE: 1
